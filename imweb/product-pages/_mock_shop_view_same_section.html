<!doctype html><html><head><meta charset="utf-8"><title>mock: loader in same section as detail body</title></head><body>
<div class="section_wrap" id="s2000a"><div id="prod_detail"><div class="real_price">28,900원</div></div></div>
<!-- 상세정보 탭 본문과 로더가 같은 구역 (아임웹 공용 상세 페이지에서 실제로 이랬던 것으로 추정) -->
<div class="section_wrap" id="s2000b">
<div class="prod_detail_tab"><div id="prod_detail_body"><div id="native"><p>아임웹 상품별 상세 설명 (비상용)</p></div></div></div>
<style>
  html.bd-pending #prod_detail_body > :not([data-bd-piece]),
  html.bd-page-on #prod_detail_body > :not([data-bd-piece]) { display: none !important; }
</style>
<div id="bydose-pages" data-base="/imweb/product-pages/"></div>
<script>
(function () {
  var r = document.getElementById('bydose-pages');
  var h = document.documentElement; h.classList.add('bd-pending');
  setTimeout(function () { h.classList.remove('bd-pending'); }, 6000);
  var s = document.createElement('script'); s.src = r.getAttribute('data-base') + 'router.js?v=1';
  s.onerror = function () { h.classList.remove('bd-pending'); }; document.body.appendChild(s);
})();
</script>
</div></body></html>
