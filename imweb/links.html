<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>byDose — Links</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  :root {
    --cream:  #F3F3E9;
    --dark:   #2A2A29;
    --orange: #D35B40;
    --muted:  #5A5A58;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    background: var(--cream);
    font-family: '42dot Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--dark);
  }

  /* ── Amoeba Blob background (same clip-path/blur/grain technique as the
       section4~6 card icon generator, blown up to fill the whole viewport) ── */
  .bd-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: var(--cream);
  }

  .bd-blob-layer {
    position: absolute;
    inset: 0;
  }

  /* Blur lives on the wrap (0×0, animated) and clip-path lives on the shape
     (its child) — same split used by icon-illustration-generator.html.
     Combining filter+clip-path on ONE element renders with a hard, unblurred
     edge on Safari/iOS WebKit (incl. Instagram's in-app browser), so they
     must stay on separate elements. */
  .bd-blob-wrap {
    position: absolute;
    width: 0;
    height: 0;
    will-change: transform;
    animation-name: bd-blob-move;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  .bd-blob-shape {
    position: absolute;
  }

  @keyframes bd-blob-move {
    0%   { transform: scale(1) translate(0, 0); }
    50%  { transform: scale(var(--bd-boost, 1.1)) translate(var(--bd-dx, 3vw), var(--bd-dy, 3vh)); }
    100% { transform: scale(1) translate(0, 0); }
  }

  .bd-scrim {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 42% at 50% 18%, rgba(243, 243, 233, 0.7), transparent 68%);
    pointer-events: none;
  }

  .bd-grain {
    position: absolute;
    inset: 0;
    opacity: 0.4;
    mix-blend-mode: overlay;
    pointer-events: none;
    background-repeat: repeat;
    background-size: 72px 72px;
  }

  @media (prefers-reduced-motion: reduce) {
    .bd-blob-wrap { animation: none !important; }
  }

  .bd-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: max(64px, 8vh) 24px calc(40px + env(safe-area-inset-bottom));
  }

  .bd-inner {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Profile ── */
  .bd-profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(14px);
    animation: bd-fadein 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
  }

  .bd-avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    overflow: hidden;

    background: #F4F3E9;
    border: 1px solid rgba(255, 255, 255, 0.5);
  }

  .bd-avatar img {
    width: 58%;
    height: auto;
    display: block;
  }

  .bd-tagline {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
    line-height: 1.6;
    word-break: keep-all;
  }

  /* ── Link list — glassmorphism (same technique as section1.html's .bubble-item) ── */
  .bd-links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bd-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 18px 20px;
    border-radius: 20px;
    overflow: hidden;
    text-decoration: none;
    color: var(--dark);

    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow:
      0 8px 28px rgba(42, 42, 41, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.6),
      inset 0 -1px 0 rgba(255, 255, 255, 0.15),
      inset 0 0 40px 20px rgba(255, 255, 255, 0.12);

    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;

    opacity: 0;
    transform: translateY(14px);
    animation: bd-fadein 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @supports not (backdrop-filter: blur(1px)) {
    .bd-link { background: rgba(255, 255, 255, 0.88); }
  }

  .bd-link::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
  }

  .bd-link::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 1px; height: 100%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), transparent, rgba(255, 255, 255, 0.2));
  }

  .bd-link:nth-child(1) { animation-delay: 0.12s; }
  .bd-link:nth-child(2) { animation-delay: 0.18s; }
  .bd-link:nth-child(3) { animation-delay: 0.24s; }
  .bd-link:nth-child(4) { animation-delay: 0.30s; }
  .bd-link:nth-child(5) { animation-delay: 0.36s; }

  .bd-link:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.64);
    box-shadow:
      0 14px 36px rgba(42, 42, 41, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      inset 0 -1px 0 rgba(255, 255, 255, 0.18);
  }

  .bd-link:active { transform: translateY(0); }

  .bd-link-icon {
    position: relative;
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.55);
  }

  .bd-link-icon svg {
    width: 20px;
    height: 20px;
    stroke: var(--dark);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .bd-link-icon img {
    width: 20px;
    height: 20px;
  }

  .bd-link-text {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bd-link-title {
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  .bd-link-sub {
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: -0.1px;
  }

  .bd-link-arrow {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    stroke: rgba(42, 42, 41, 0.4);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.2s ease;
  }

  .bd-link:hover .bd-link-arrow { transform: translateX(3px); }

  /* ── Footer ── */
  .bd-footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--muted);
    opacity: 0;
    text-align: center;
    letter-spacing: -0.1px;
    animation: bd-fadein 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }

  @keyframes bd-fadein {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bd-profile, .bd-link, .bd-footer { animation: none !important; opacity: 1; transform: none; }
  }

  @media (max-width: 380px) {
    .bd-link { padding: 16px 16px; gap: 12px; }
    .bd-avatar { width: 84px; height: 84px; }
  }
</style>
</head>

  var grainEl = document.getElementById('bdGrain');
  grainEl.style.backgroundImage = "url(data:image/png;base64," + GRAIN_B64 + ")";

  /* Amoeba Blob path generator — same Catmull-Rom -> cubic-bezier smoothing as the
     section4~6 icon generator (icon-illustration-generator.html), scaled up to
     viewport-filling size instead of a small card icon. */
  function makeBlobPath(size) {
    var n = 7 + Math.floor(Math.random() * 4); // 7-10 points
    var jitter = 0.30 + Math.random() * 0.20;
    var center = size / 2;
    var baseR = size * 0.40;
    var pts = [];
    for (var i = 0; i < n; i++) {
      var angle = (2 * Math.PI * i) / n;
      var r = baseR * (1 + (Math.random() * 2 - 1) * jitter);
      pts.push([center + r * Math.cos(angle), center + r * Math.sin(angle)]);
    }
    function get(i) { return pts[((i % n) + n) % n]; }
    var d = 'M ' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1) + ' ';
    for (var j = 0; j < n; j++) {
      var p0 = get(j - 1), p1 = get(j), p2 = get(j + 1), p3 = get(j + 2);
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += 'C ' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + ' ';
    }
    return d + 'Z';
  }

  var PALETTE = ['#2A2A29', '#9DAABA', '#989B87', '#D35B40', '#FFFFFF'];

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function clampPct(v) { return Math.min(100, Math.max(0, v)); }

  // Five spread-out anchor zones (one per palette color) so blobs don't pile up
  // in the same corner — 3+ different hues stacked at high opacity in one spot
  // alpha-blends toward a muddy gray, which was washing out the color variety.
  var ANCHORS = [
    { x: 8, y: 10 }, { x: 92, y: 8 }, { x: 94, y: 55 }, { x: 10, y: 90 }, { x: 90, y: 92 }
  ];

  function initBlobs() {
    var layer = document.getElementById('bdBlobLayer');
    var vw = window.innerWidth, vh = window.innerHeight;
    var maxDim = Math.max(vw, vh);
    var colors = shuffled(PALETTE);
    var anchors = shuffled(ANCHORS);
    var frag = document.createDocumentFragment();

    for (var i = 0; i < colors.length; i++) {
      var anchor = anchors[i];
      var size = Math.round(maxDim * (0.44 + Math.random() * 0.22)); // big enough to bridge the gaps between anchors, small enough that each shape's own soft edge still lands inside the viewport
      var path = makeBlobPath(size);
      var color = colors[i];
      var isWhite = color === '#FFFFFF';
      var blur = Math.round(size * 0.09); // clearly hazy edge without dissolving the whole shape
      var opacity = (isWhite ? 0.34 : 0.42) + Math.random() * 0.14;
      var dur = Math.round(13000 + Math.random() * 9000);
      var delay = -Math.round(Math.random() * dur);
      var dx = (Math.random() * 2 - 1) * 18;
      var dy = (Math.random() * 2 - 1) * 18;
      var boost = 1.12 + Math.random() * 0.16;

      // Blur goes on the wrap (0x0, animated); clip-path + fill go on the shape
      // (its child) — required split, see the comment on .bd-blob-wrap above.
      var wrap = document.createElement('div');
      wrap.className = 'bd-blob-wrap';
      wrap.style.left = clampPct(anchor.x + (Math.random() * 2 - 1) * 10) + 'vw';
      wrap.style.top = clampPct(anchor.y + (Math.random() * 2 - 1) * 10) + 'vh';
      wrap.style.filter = 'blur(' + blur + 'px)';
      wrap.style.opacity = opacity.toFixed(2);
      wrap.style.animationDuration = dur + 'ms';
      wrap.style.animationDelay = delay + 'ms';
      wrap.style.setProperty('--bd-dx', dx.toFixed(2) + 'vw');
      wrap.style.setProperty('--bd-dy', dy.toFixed(2) + 'vh');
      wrap.style.setProperty('--bd-boost', boost.toFixed(3));

      var shape = document.createElement('div');
      shape.className = 'bd-blob-shape';
      shape.style.width = size + 'px';
      shape.style.height = size + 'px';
      shape.style.left = (-size / 2) + 'px';
      shape.style.top = (-size / 2) + 'px';
      shape.style.background = color;
      shape.style.clipPath = "path('" + path + "')";
      shape.style.webkitClipPath = "path('" + path + "')";

      wrap.appendChild(shape);
      frag.appendChild(wrap);
    }
    layer.appendChild(frag);
  }

  initBlobs();
})();
