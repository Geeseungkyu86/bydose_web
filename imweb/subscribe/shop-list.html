<!--
  상품 리스트 페이지 (새 페이지, 주소 제안: bydose.kr/shop) — 아임웹 코드 위젯
  아임웹 기본 상품 목록 위젯 대신 직접 만든 이유: 정기배송을 맨 앞에 크게 두려고(목표: 6개월 정기배송 판매).
  순서: 정기배송(크게) → 나잇나잇 크림 → 나잇나잇 미스트
  가격 표시: 크림은 판매가가 세일 때마다 바뀌어 적지 않고 상품 페이지로 보낸다. 미스트 소매가는 미정(MIST_PRICE).
  PLAN_URL, MIST_URL, MIST_IMG는 정해지면 채운다. 문구는 초안.
-->
<style>
#bd-shop { --bg:#F3F3E9; --ink:#2A2A29; --ink70:rgba(42,42,41,.7); --ink50:rgba(42,42,41,.5); --accent:#D35B40;
  background:var(--bg); color:var(--ink); font-family:'42dot Sans',-apple-system,'Apple SD Gothic Neo',sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all; }
#bd-shop *, #bd-shop *::before, #bd-shop *::after { box-sizing:border-box; }
#bd-shop p { margin:0; }
#bd-shop .wrap { max-width:1080px; margin:0 auto; padding:40px 20px 72px; display:flex; flex-direction:column; gap:16px; }
#bd-shop .head { font-size:22px; font-weight:700; letter-spacing:-.3px; margin-bottom:8px; }
#bd-shop a { color:inherit; text-decoration:none; }
#bd-shop .hero { display:flex; flex-wrap:wrap; background:var(--ink); color:var(--bg); border-radius:16px; overflow:hidden; }
#bd-shop .hero .img { flex:1 1 300px; min-height:220px; background:#D9D6C6 center/cover no-repeat; }
#bd-shop .hero .txt { flex:1 1 300px; padding:24px 22px; display:flex; flex-direction:column; gap:8px; }
#bd-shop .tag { align-self:flex-start; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--accent); color:#fff; }
#bd-shop .hero .name { font-size:20px; font-weight:700; }
#bd-shop .hero .desc { font-size:14px; color:rgba(243,243,233,.75); line-height:1.6; }
#bd-shop .hero .price { font-size:22px; font-weight:800; margin-top:4px; }
#bd-shop .hero .price span { font-size:13px; font-weight:400; color:rgba(243,243,233,.6); }
#bd-shop .hero .go { margin-top:8px; align-self:flex-start; font-size:14px; font-weight:700; padding:12px 16px; border-radius:8px; background:var(--bg); color:var(--ink); }
#bd-shop .grid { display:flex; flex-wrap:wrap; gap:16px; }
#bd-shop .card { flex:1 1 240px; background:#fff; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
#bd-shop .card .img { aspect-ratio:1/1; background:#ECEBE1 center/contain no-repeat; }
#bd-shop .card .txt { padding:16px 16px 18px; display:flex; flex-direction:column; gap:4px; }
#bd-shop .card .name { font-size:16px; font-weight:700; }
#bd-shop .card .desc { font-size:13px; color:var(--ink70); line-height:1.5; }
#bd-shop .card .sub { font-size:13px; color:var(--accent); font-weight:700; margin-top:6px; }
</style>

<div id="bd-shop">
  <div class="wrap">
    <p class="head">제품</p>

    <a class="hero" href="PLAN_URL">
      <div class="img" style="background-image:url(https://cdn.imweb.me/upload/S2024082705e460c86991c/ef39fff65a831.png)"></div>
      <div class="txt">
        <span class="tag">추천</span>
        <p class="name">나잇나잇 정기배송</p>
        <p class="desc">매달 크림 1개 무료배송.<br>6개월 한 번에 결제하면 미스트 1개 함께.</p>
        <p class="price">16,500원 <span>한 달 · 6개월 99,000원</span></p>
        <span class="go">플랜 보기 →</span>
      </div>
    </a>

    <div class="grid">
      <a class="card" href="https://bydose.kr/shop_view?idx=63">
        <div class="img" style="background-image:url(https://cdn.imweb.me/upload/S2024082705e460c86991c/37c6ab3dbe655.png)"></div>
        <div class="txt">
          <p class="name">나잇나잇 크림 50ml</p>
          <p class="desc">자기 전 마지막 단계에 바르는 크림</p>
          <p class="sub">정기배송이면 한 달 16,500원 →</p>
        </div>
      </a>
      <a class="card" href="MIST_URL">
        <div class="img" style="background-image:url(MIST_IMG)"></div>
        <div class="txt">
          <p class="name">나잇나잇 미스트</p>
          <p class="desc">MIST_PRICE</p>
          <p class="sub">6개월 정기배송에 1개 함께 →</p>
        </div>
      </a>
    </div>
  </div>
</div>
