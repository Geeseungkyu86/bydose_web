<!--
  나잇나잇 크림 — 고민 대화 (대화형 UI)
  기존 "알약형 카드 5개"를 채팅 말풍선으로 바꾼 버전.
  카드에서는 한 줄/두 줄이 섞여 높이가 들쭉날쭉했다. 긴 문장은 문구는 그대로 두고
  말풍선 두 개로 나눠 보내는 식으로 끊어, 모든 말풍선이 모바일(393px)에서도 한 줄에 들어가게 했다.
  아바타는 시안용으로 기존 화면 캡처에서 잘라 인라인 webp로 넣었다 — 원본 일러스트 CDN URL로 교체 권장.
  아임웹 코드 위젯 제약: h1~h6 사용 금지. 모든 클래스는 .nn-chat 아래로 스코프.
-->
<style>
.nn-chat{
  --nn-bg:#F3F3E9;--nn-bubble:#FAFAF6;--nn-ink:#2A2A29;--nn-muted:rgba(42,42,41,.55);
  background:var(--nn-bg);color:var(--nn-ink);
  font-family:"42dot Sans","Asta Sans",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
  padding:40px 20px;word-break:keep-all;-webkit-font-smoothing:antialiased;
}
.nn-chat__list{max-width:560px;margin:0 auto;padding:0;list-style:none;display:flex;flex-direction:column;gap:20px}
.nn-chat__msg{display:flex;align-items:flex-start;gap:10px}
.nn-chat__avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--nn-bubble);overflow:hidden}
.nn-chat__avatar img{display:block;width:100%;height:100%}
.nn-chat__body{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:calc(100% - 54px)}
.nn-chat__name{margin:0 0 2px;font-size:13px;line-height:16px;color:var(--nn-muted)}
.nn-chat__bubble{
  margin:0;background:var(--nn-bubble);
  border-radius:4px 20px 20px 20px;     /* 아바타 쪽 위 모서리만 각지게 — 말꼬리 대신 */
  padding:11px 16px;font-size:16px;line-height:24px;
}
/* 같은 사람이 이어 보낸 두 번째 말풍선은 모서리를 모두 둥글게 */
.nn-chat__bubble + .nn-chat__bubble{border-radius:20px}
/* 스크롤로 들어오면 한 건씩 차례로 올라옴. JS가 없거나 모션 줄이기 설정이면 처음부터 보임 */
.nn-chat.is-anim .nn-chat__msg{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
.nn-chat.is-anim .nn-chat__msg.is-in{opacity:1;transform:none}
@media (min-width:769px){
  .nn-chat{padding:80px 20px}
  .nn-chat__list{gap:24px}
  .nn-chat__avatar{width:52px;height:52px}
  .nn-chat__body{max-width:calc(100% - 64px)}
  .nn-chat__name{font-size:14px}
  .nn-chat__bubble{font-size:18px;line-height:28px;padding:14px 20px}
}
</style>

<script>
(function(){
  var root = document.querySelector('.nn-chat');
  if (!root || !('IntersectionObserver' in window)) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.classList.add('is-anim');
  var msgs = root.querySelectorAll('.nn-chat__msg');
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      io.disconnect();
      msgs.forEach(function(m, i){ setTimeout(function(){ m.classList.add('is-in'); }, i * 350); });
    });
  }, { threshold: 0.25 });
  io.observe(root);
})();
</script>
