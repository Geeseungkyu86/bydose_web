  </div>

<script>
/* 히어로를 커스텀 GNB 뒤로 끌어올림.
   아임웹의 "상단 겹치기"를 켜도 헤더가 position:relative로 남아(2026-08-07 콘솔 실측 확인)
   문서 흐름에서 콘텐츠를 밀어낸다 — 헤더 76px + 그 위아래 여백까지 합쳐 히어로가 146px 아래에서 시작했다.
   헤더 자체는 배경이 transparent라(글로벌 헤더 CSS [1]) 그 자리엔 페이지 배경만 비쳐 "빈 띠"로 보였던 것.
   PC/모바일 헤더 높이가 다르고 관리자 미리보기 바 유무로도 값이 달라지므로 고정 px 대신 실측해서 보정한다.
   헤더는 z-index 99999라 끌어올린 이미지 위에 그대로 떠 있는다. */
(function(){
  var HEADERS = '#s2025111496adad2a19d7b, #s2025111421543da50f666';   /* PC · 모바일 헤더 섹션 */

  function fitHero(){
    var hero = document.querySelector('.nnp .hero');
    if (!hero) return;

    hero.style.marginTop = '0px';               /* 매번 초기화 후 재측정 — 리사이즈 누적 방지 */
    var heroTop = hero.getBoundingClientRect().top + window.scrollY;

    /* 히어로보다 위에 있는 보이는 헤더 중 가장 높은 지점 = 이미지가 닿아야 할 목표선.
       문서 0이 아니라 헤더 상단 기준이라, 미리보기 바가 있어도 그 아래로 정확히 붙는다. */
    var target = null;
    document.querySelectorAll(HEADERS).forEach(function(h){
      var r = h.getBoundingClientRect();
      if (r.height < 1) return;                 /* 미디어쿼리로 숨겨진 쪽은 제외 */
      var t = r.top + window.scrollY;
      if (t < heroTop && (target === null || t < target)) target = t;
    });
    if (target === null) return;                /* 헤더를 못 찾으면 원래대로 둔다 */

    hero.style.marginTop = -(heroTop - target) + 'px';
  }

  fitHero();
  window.addEventListener('load', fitHero);     /* 웹폰트·이미지 로드 후 값이 밀리는 경우 재보정 */
  window.addEventListener('resize', fitHero);
})();
</script>
<script>
/* 아임웹 헤더 오프셋 상쇄 — home-hero.html의 fitHero()와 동일한 방식.
   아임웹 헤더는 fixed가 아니라 일반 흐름에 놓여서 첫 섹션을 아래로 밀어낸다(PC 76px / 좁은 화면 54px).
   그만큼 위로 당겨야 히어로가 화면 최상단부터 꽉 찬다.
   - 높이가 브레이크포인트마다 달라서 고정값을 쓰면 한쪽이 틀어진다 → 실측한다.
   - 음수 마진이 아임웹 래퍼를 거치며 일부 상쇄(margin collapsing)돼 N만큼 당겨도 N보다 덜 움직이는
     경우가 있다 → 잔차를 보고 반복 수렴시킨다. 단독 프로토타입은 1회, 아임웹에서는 3회쯤 걸린다.
   - margin-top을 CSS 변수가 아니라 인라인으로 직접 넣는다. 변수로 하면 값만 바꿨을 때
     stylesheet의 calc()가 재계산되지 않고 margin-top이 0으로 남는 현상이 있었다.
   단독으로 열면 오프셋이 0이라 아무 효과도 없다 — 아임웹에 심었을 때만 동작한다. */
(function () {
  var hero = document.querySelector('.nnp .hero');
  if (!hero) return;

  function fitHero() {
    hero.style.marginTop = '0px';   // 재기 전 초기화
    var pull = hero.getBoundingClientRect().top + window.pageYOffset;

    for (var i = 0; i < 5; i++) {
      hero.style.marginTop = (-pull) + 'px';
      var residual = hero.getBoundingClientRect().top + window.pageYOffset;
      if (Math.abs(residual) < 0.5) break;
      pull += residual;
    }
  }

  fitHero();
  window.addEventListener('load', fitHero);            // 웹폰트·로고가 자리 잡은 뒤 재측정
  window.addEventListener('resize', fitHero);
  window.addEventListener('orientationchange', fitHero);
})();
</script>
<script>
/* 히어로 화살표 → 아임웹 구매 영역으로 부드럽게 이동. html{scroll-behavior:smooth}는 아임웹 페이지 전체에
   걸리므로 쓰지 않고 여기서만 smooth 스크롤한다. 해시를 남기지 않는 이유: 아임웹이 #prod_detail_* 해시로
   탭을 바꾸기 때문 */
(function(){
  document.querySelectorAll('.nnp [data-nnp-scroll]').forEach(function(a){
    a.addEventListener('click', function(e){
      var t = document.querySelector(a.getAttribute('href'));
      if (!t) return;
      e.preventDefault();
      t.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
})();
</script>
