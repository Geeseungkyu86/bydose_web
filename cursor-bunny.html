<script>
(function () {
  var cursor = document.getElementById('bydoseCursorBunny');

  // 데스크탑(마우스 + hover 가능)에서만: 모바일/터치에서는 커서 자체가 없어 의미 없음
  var isDesktopPointer =
    window.matchMedia('(hover: hover) and (pointer: fine)').matches &&
    window.innerWidth >= 900;

  if (!isDesktopPointer) return;

  var OFFSET = 46; // 실제 포인터로부터 떨어진 거리(px)
  var offsetDx = OFFSET * Math.cos(Math.PI / 4);
  var offsetDy = -OFFSET * Math.sin(Math.PI / 4); // 음수 = 위쪽

  window.addEventListener('mousemove', function (e) {
    cursor.classList.add('is-active');
    cursor.style.transform =
      'translate(' + (e.clientX + offsetDx - 32) + 'px, ' + (e.clientY + offsetDy - 16) + 'px)';
  });

  window.addEventListener('mouseleave', function () {
    cursor.classList.remove('is-active');
  });
})();
</script>
