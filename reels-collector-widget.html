<script async src="https://www.instagram.com/embed.js"></script>
<style>
  :root {
    --bg: #f7f5f2;
    --card-bg: #ffffff;
    --ink: #1e1c1a;
    --muted: #8a8580;
    --accent: #c9a06a; /* beige, accent only */
    --line: #e6e2dc;
    --new: #e0523f;
  }
  #bydose-reels * { box-sizing: border-box; }
  #bydose-reels {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 32px 20px 80px;
  }
  #bydose-reels .wrap { max-width: 1080px; margin: 0 auto; }
  #bydose-reels h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  #bydose-reels .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  #bydose-reels .banner {
    display: none;
    background: #fdece8;
    border: 1px solid #f4c7bd;
    color: var(--new);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  #bydose-reels .banner.show { display: block; }

  #bydose-reels .add-panel {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 28px;
  }
  #bydose-reels .add-panel .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  #bydose-reels .add-panel input, #bydose-reels .add-panel select {
    flex: 1;
    min-width: 160px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
  }
  #bydose-reels .add-panel button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #bydose-reels .add-panel button:hover { opacity: 0.85; }

  #bydose-reels .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  #bydose-reels .tag-filter { display: flex; gap: 6px; flex-wrap: wrap; }
  #bydose-reels .tag-chip {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
  }
  #bydose-reels .tag-chip.active {
    background: var(--ink);

  }
  #bydose-reels .util-btns { display: flex; gap: 8px; }
  #bydose-reels .util-btns button {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink);
  }

  #bydose-reels .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  #bydose-reels .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
  }
  #bydose-reels .card.is-new { box-shadow: 0 0 0 2px var(--new); }
  #bydose-reels .new-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--new);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    z-index: 5;
  }
  #bydose-reels .embed-wrap { min-height: 200px; background: #f0ede8; }
  #bydose-reels .embed-wrap iframe { width: 100% !important; }
  #bydose-reels .card-body { padding: 12px 14px; }
  #bydose-reels .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  #bydose-reels .card-tags span {
    font-size: 11px;
    background: #f2ede4;
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 20px;
  }
  #bydose-reels .card-note { font-size: 13px; color: var(--ink); margin-bottom: 6px; white-space: pre-wrap; }
  #bydose-reels .card-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  #bydose-reels .card-meta a { color: var(--muted); }
  #bydose-reels .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    text-decoration: underline;
  }
  #bydose-reels .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }

  #bydose-reels .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  #bydose-reels .gear-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
    white-space: nowrap;
  }

  #bydose-reels .setup-box {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    max-width: 560px;
    margin: 40px auto;
  }
  #bydose-reels .setup-box h2 { font-size: 16px; margin: 0 0 12px; }
  #bydose-reels .setup-box ol { font-size: 13px; line-height: 1.7; color: var(--ink); padding-left: 20px; margin: 0 0 16px; }
  #bydose-reels .setup-box code {
    background: #f2ede4;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
  #bydose-reels .setup-box pre {
    background: #1e1c1a;
    color: #f2ede4;
    padding: 12px;
    border-radius: 8px;
    font-size: 11px;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  #bydose-reels .setup-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 10px;
    box-sizing: border-box;
  }
  #bydose-reels .setup-box button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #bydose-reels .status-msg { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  #bydose-reels .status-msg.error { color: var(--new); }
</style>

<div id="bydose-reels">
<div class="wrap">
  <div class="top-row">
    <div>
      <h1>바이도즈 릴스 레퍼런스 콜렉터</h1>
      <div class="sub">인스타그램에서 발견한 "바이도즈 결과 느낌" 릴스 링크를 모아두는 개인용 보드입니다. 여러 기기에서 같은 목록을 봅니다.</div>
    </div>
  </div>

  <div id="setupScreen"></div>

  <div id="appScreen" style="display:none">
    <div class="banner" id="newBanner"></div>

    <div class="add-panel">
      <div class="row">
        <input id="urlInput" type="text" placeholder="인스타그램 릴스/게시물 URL (예: https://www.instagram.com/reel/xxxx/)">
      </div>
      <div class="row">
        <input id="tagInput" type="text" placeholder="태그 (쉼표로 구분, 예: 피부이야기, 성분)">
        <input id="noteInput" type="text" placeholder="메모 (왜 참고할만한지)">
        <button onclick="addReel()">추가</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="tag-filter" id="tagFilter"></div>
      <div class="util-btns">
        <button onclick="markAllSeen()">새 항목 확인 완료</button>
        <button onclick="exportData()">내보내기</button>
        <button onclick="document.getElementById('importFile').click()">가져오기</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </div>

    <div class="status-msg" id="statusMsg"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyMsg" style="display:none">아직 저장된 릴스가 없어요. 위에 링크를 붙여넣어 보세요.</div>
  </div>
</div>
</div>

<script>
const CONFIG_KEY = 'bydose_reels_supabase_config';
const LAST_SEEN_KEY = 'bydose_reels_last_seen';

// 하드코딩된 Supabase 연결 정보 — 이제 기기/브라우저마다 다시 연결할 필요 없음
const HARDCODED_SUPABASE_CONFIG = {
  url: 'https://echrfxapnrehzohuktxk.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjaHJmeGFwbnJlaHpvaHVrdHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMDMxNTIsImV4cCI6MjA5OTY3OTE1Mn0.i0rkuHhRfFbpYwu3_dVhh1REBxxq2HWmAiF2hSzsspM'
};
let activeTag = null;
let sb = null;
let cachedItems = [];

function getConfig() {
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY)); }
  catch (e) { return null; }
}
function saveConfig(url, key) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify({ url, key }));
}
function clearConfig() {
  localStorage.removeItem(CONFIG_KEY);
}

const SETUP_HTML = `
  <div class="setup-box">
    <h2>DB 연결이 필요해요 (최초 1회, 이 기기에서만)</h2>
    <ol>
      <li><a href="https://supabase.com" target="_blank">supabase.com</a>에서 무료 계정 생성 후 새 프로젝트를 만드세요.</li>
      <li>프로젝트의 <b>SQL Editor</b>에서 아래 코드를 실행해 테이블을 만드세요.</li>
    </ol>
    <pre>create table reels (
  id uuid primary key default gen_random_uuid(),
  url text not null,
  tags text[] not null default '{}',
  note text default '',
  created_at timestamptz not null default now()
);
alter table reels enable row level security;
create policy "public access" on reels for all using (true) with check (true);</pre>
    <ol start="3">
      <li>프로젝트의 <b>Settings → API</b>에서 <code>Project URL</code>과 <code>anon public key</code>를 복사해 아래에 입력하세요.</li>
    </ol>
    <input id="cfgUrl" type="text" placeholder="Project URL (예: https://xxxx.supabase.co)">
    <input id="cfgKey" type="text" placeholder="anon public key">
    <button onclick="connectSupabase()">연결하기</button>
    <div class="status-msg error" id="setupError" style="margin-top:10px"></div>
  </div>
`;

function showSetup(forceOpen) {
  const cfg = getConfig();
  if (cfg && !forceOpen) {
    initSupabase(cfg);
    return;
  }
  document.getElementById('setupScreen').innerHTML = SETUP_HTML;
  document.getElementById('setupScreen').style.display = 'block';
  document.getElementById('appScreen').style.display = 'none';
  if (cfg) {
    document.getElementById('cfgUrl').value = cfg.url;
    document.getElementById('cfgKey').value = cfg.key;
  }
}

const SUPABASE_CDN_URLS = [
  'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/umd/supabase.min.js'
];
let supabaseLoadPromise = null;

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error('load failed: ' + src));
    document.head.appendChild(s);
  });
}

async function ensureSupabaseLib() {
  if (window.supabase) return true;
  if (supabaseLoadPromise) return supabaseLoadPromise;
  supabaseLoadPromise = (async () => {
    for (const url of SUPABASE_CDN_URLS) {
      try {
        await loadScriptOnce(url);
        if (window.supabase) return true;
      } catch (e) { /* try next CDN */ }
    }
    return false;
  })();
  return supabaseLoadPromise;
}

async function connectSupabase() {
  const url = document.getElementById('cfgUrl').value.trim();
  const key = document.getElementById('cfgKey').value.trim();
  const errEl = document.getElementById('setupError');
  if (!url || !key) {
    errEl.textContent = 'Project URL과 anon key를 모두 입력해주세요.';
    return;
  }
  errEl.textContent = 'Supabase 라이브러리를 불러오는 중이에요...';
  const loaded = await ensureSupabaseLib();
  if (!loaded) {
    errEl.textContent = 'Supabase 라이브러리를 3개 CDN에서 모두 불러오지 못했어요. 인터넷 연결을 확인하거나, 광고 차단·보안 확장 프로그램을 잠시 꺼보고 새로고침 후 다시 시도해주세요.';
    return;
  }
  errEl.textContent = '연결 확인 중...';
  const client = window.supabase.createClient(url, key);
  const { error } = await client.from('reels').select('id').limit(1);
  if (error) {
    errEl.textContent = '연결 실패: ' + error.message + ' (테이블 생성 여부, URL/key를 확인해주세요)';
    return;
  }
  saveConfig(url, key);
  initSupabase({ url, key });
}

async function initSupabase(cfg) {
  const loaded = await ensureSupabaseLib();
  if (!loaded) {
    document.getElementById('setupScreen').innerHTML =
      '<div class="setup-box"><div class="status-msg error">Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해주세요.</div></div>';
    document.getElementById('setupScreen').style.display = 'block';
    document.getElementById('appScreen').style.display = 'none';
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.key);
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  render();
}

function getLastSeen() {
  return Number(localStorage.getItem(LAST_SEEN_KEY)) || 0;
}
function markAllSeen() {
  localStorage.setItem(LAST_SEEN_KEY, Date.now().toString());
  render();
}

async function loadData() {
  const statusEl = document.getElementById('statusMsg');
  const { data, error } = await sb.from('reels').select('*').order('created_at', { ascending: false });
  if (error) {
    statusEl.textContent = '불러오기 실패: ' + error.message;
    statusEl.classList.add('error');
    return cachedItems;
  }
  statusEl.textContent = '';
  statusEl.classList.remove('error');
  cachedItems = data.map(r => ({
    id: r.id,
    url: r.url,
    tags: r.tags || [],
    note: r.note || '',
    addedAt: new Date(r.created_at).getTime()
  }));
  return cachedItems;
}

async function addReel() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  if (!/instagram\.com\/(reel|p|tv)\//.test(url)) {
    alert('인스타그램 릴스/게시물 URL 형식이 아닌 것 같아요. (instagram.com/reel/... 형태)');
    return;
  }
  const tagsRaw = document.getElementById('tagInput').value.trim();
  const note = document.getElementById('noteInput').value.trim();
  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

  const { error } = await sb.from('reels').insert({ url, tags, note });
  if (error) {
    alert('저장 실패: ' + error.message);
    return;
  }

  document.getElementById('urlInput').value = '';
  document.getElementById('tagInput').value = '';
  document.getElementById('noteInput').value = '';
  await render();
}

async function deleteReel(id) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  const { error } = await sb.from('reels').delete().eq('id', id);
  if (error) {
    alert('삭제 실패: ' + error.message);
    return;
  }
  await render();
}

function exportData() {
  const blob = new Blob([JSON.stringify(cachedItems, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `bydose-reels-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const incoming = JSON.parse(reader.result);
      if (!Array.isArray(incoming)) throw new Error('invalid');
      const existingUrls = new Set(cachedItems.map(i => i.url));
      const toInsert = incoming.filter(i => !existingUrls.has(i.url))
        .map(i => ({ url: i.url, tags: i.tags || [], note: i.note || '' }));
      if (toInsert.length > 0) {
        const { error } = await sb.from('reels').insert(toInsert);
        if (error) throw error;
      }
      await render();
      alert(`${incoming.length}개 항목 중 ${toInsert.length}개를 새로 추가했어요.`);
    } catch (e) {
      alert('가져오기에 실패했어요: ' + e.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function allTags(items) {
  const set = new Set();
  items.forEach(i => i.tags.forEach(t => set.add(t)));
  return Array.from(set);
}

function renderTagFilter(items) {
  const wrap = document.getElementById('tagFilter');
  const tags = allTags(items);
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'tag-chip' + (activeTag === null ? ' active' : '');
  allChip.textContent = '전체';
  allChip.onclick = () => { activeTag = null; render(); };
  wrap.appendChild(allChip);
  tags.forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip' + (activeTag === tag ? ' active' : '');
    chip.textContent = tag;
    chip.onclick = () => { activeTag = (activeTag === tag ? null : tag); render(); };
    wrap.appendChild(chip);
  });
}

async function render() {
  const items = await loadData();
  const lastSeen = getLastSeen();
  const newCount = items.filter(i => i.addedAt > lastSeen).length;

  const banner = document.getElementById('newBanner');
  if (newCount > 0) {
    banner.textContent = `마지막 확인 이후 새 항목 ${newCount}개가 있어요.`;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }

  renderTagFilter(items);

  const filtered = activeTag ? items.filter(i => i.tags.includes(activeTag)) : items;
  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('emptyMsg');
  grid.innerHTML = '';

  if (filtered.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card' + (item.addedAt > lastSeen ? ' is-new' : '');

    const badge = item.addedAt > lastSeen ? '<div class="new-badge">NEW</div>' : '';
    const tagsHtml = item.tags.map(t => `<span>${escapeHtml(t)}</span>`).join('');
    const dateStr = new Date(item.addedAt).toLocaleDateString('ko-KR');

    card.innerHTML = `
      ${badge}
      <div class="embed-wrap">
        <blockquote class="instagram-media" data-instgrm-permalink="${escapeHtml(item.url)}" data-instgrm-version="14" style="margin:0;width:100%;"></blockquote>
      </div>
      <div class="card-body">
        <div class="card-tags">${tagsHtml}</div>
        ${item.note ? `<div class="card-note">${escapeHtml(item.note)}</div>` : ''}
        <div class="card-meta">
          <span>${dateStr} 추가</span>
          <button class="del-btn" onclick="deleteReel('${item.id}')">삭제</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  if (window.instgrm && window.instgrm.Embeds) {
    window.instgrm.Embeds.process();
  } else {
    const timer = setInterval(() => {
      if (window.instgrm && window.instgrm.Embeds) {
        window.instgrm.Embeds.process();
        clearInterval(timer);
      }
    }, 300);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

initSupabase(HARDCODED_SUPABASE_CONFIG);
</script>
