name: Purge jsDelivr cache for product pages

# main에 product-pages가 바뀌어 병합되면 jsDelivr CDN 캐시(최대 12시간)를 바로 비운다.
on:
  push:
    branches: [main]
    paths:
      - 'imweb/product-pages/**'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purge changed files
        run: |
          base="https://purge.jsdelivr.net/gh/geeseungkyu86/bydose_web@main"  # loader.html과 같은 소문자 주소
          for f in imweb/product-pages/router.js imweb/product-pages/pages/*.html; do
            echo "purge $f"
            curl -fsS "$base/$f" > /dev/null || echo "  failed: $f"
          done
