<script>
(function () {
  var cursor = document.getElementById('bydoseCursorBunny');

  // 데스크탑(마우스 + hover 가능)에서만: 모바일/터치에서는 커서 자체가 없어 의미 없음
  var isDesktopPointer =
    window.matchMedia('(hover: hover) and (pointer: fine)').matches &&
    window.innerWidth >= 900;

  if (!isDesktopPointer) return;

  var OFFSET = 46; // 실제 포인터로부터 떨어진 거리(px)
  var offsetDx = OFFSET * Math.cos(Math.PI / 4);
  var offsetDy = -OFFSET * Math.sin(Math.PI / 4); // 음수 = 위쪽

  window.addEventListener('mousemove', function (e) {
    cursor.classList.add('is-active');
    cursor.style.transform =
      'translate(' + (e.clientX + offsetDx - 32) + 'px, ' + (e.clientY + offsetDy - 16) + 'px)';
  });

  window.addEventListener('mouseleave', function () {
    cursor.classList.remove('is-active');
  });
})();
</script>

<!--
  모바일 메뉴 펼치기
  아임웹 모바일 메뉴서랍의 ⋮ 버튼 안에 있는 "장바구니"와 "마이페이지"를
  메뉴 목록("나잇나잇 크림", "이야기") 아래로 꺼낸다.
  - 장바구니: 항상 보인다.
  - 마이페이지: 로그인했을 때만 보인다(⋮ 안에 마이페이지가 있을 때).
  꺼낸 항목은 ⋮ 안에서는 숨긴다.

  아임웹 모바일 메뉴서랍 구조 (2026-10-15 bydose.kr 실제 화면 기준):
    div.viewport-nav.mobile
      div.profile-area  … ⋮ 목록 ul.dropdown-menu > li.drop_mypage / li.drop_cart / …
      li.depth-01 > a > span.plain_name   (나잇나잇 크림)
      li.depth-01 > a > span.plain_name   (이야기)
  메뉴 칸(li.depth-01)을 복제해서 붙이므로 글씨·간격은 기존 메뉴와 같다.

  붙이는 곳: 아임웹 푸터 코드 칸 (imweb-footer-code.html에 합쳐 둠).
-->
<style>
  /* 꺼내기가 끝난 메뉴서랍에서만 ⋮ 안의 원래 항목을 숨긴다 */
  .viewport-nav.mobile.bydose-unfolded .profile-area .drop_cart,
  .viewport-nav.mobile.bydose-unfolded .profile-area .drop_mypage {
    display: none !important;

  .viewport-nav.mobile > li.bydose-shop-first {

    padding-top: 12px !important;
    border-top: 1px solid rgba(42, 42, 41, 0.15) !important;

  .viewport-nav.mobile > li.bydose-shop-item a,
  .viewport-nav.mobile > li.bydose-shop-item .plain_name {
    color: #8A8A85 !important;

    font-size: 0.85em !important;

<script>
(function () {
  var MARK = 'data-bydose-unfold';
  var ITEMS = [
    // label: 메뉴에 보일 이름, source: ⋮ 안의 원래 항목, fallback: 원래 항목이 없을 때 주소

    { label: '마이페이지', source: '.profile-area .drop_mypage a', fallback: null, always: false }
  ];

  function makeItem(template, label, href) {
    var li = template.cloneNode(true);
    li.removeAttribute('data-code');
    li.removeAttribute('id');
    li.classList.remove('active');
    li.setAttribute(MARK, label);
    li.classList.add('bydose-shop-item');
    var a = li.querySelector('a');
    if (!a) return null;
    a.setAttribute('href', href);
    a.removeAttribute('onclick');
    a.removeAttribute('data-url');
    a.classList.remove('active');
    var name = li.querySelector('.plain_name');
    if (name) name.textContent = label;
    else a.textContent = label;
    var toggle = li.querySelector('._toggle_btn');
    if (toggle) toggle.remove();
    return li;
  }

  function run() {
    try {
      var nav = document.querySelector('.viewport-nav.mobile');
      if (!nav) return;
      var menus = nav.querySelectorAll(':scope > li.depth-01:not([' + MARK + '])');
      if (!menus.length) return;
      var last = menus[menus.length - 1];

      for (var i = 0; i < ITEMS.length; i++) {
        var it = ITEMS[i];
        var src = nav.querySelector(it.source);
        var href = (src && src.getAttribute('href')) || it.fallback;
        var existing = nav.querySelector(':scope > [' + MARK + '="' + it.label + '"]');
        var show = href && (it.always || src);
        if (!show) {
          if (existing) existing.remove();
          continue;
        }
        if (existing) { last = existing; continue; }
        var li = makeItem(last, it.label, href);
        if (!li) continue;
        last.insertAdjacentElement('afterend', li);
        last = li;
      }
      var shop = nav.querySelectorAll(':scope > [' + MARK + ']');
      for (var j = 0; j < shop.length; j++) shop[j].classList.toggle('bydose-shop-first', j === 0);
      nav.classList.add('bydose-unfolded');
    } catch (e) {
      // 아임웹 구조가 바뀌면 조용히 멈춘다 (사이트와 ⋮ 메뉴는 그대로 둔다)
      if (window.console) console.warn('[bydose] 모바일 메뉴 펼치기 실패', e);
    }
  }

  // 메뉴서랍이 늦게 그려질 수 있어 로딩 후 몇 번 + 화면을 누를 때(메뉴 열기) 다시 확인한다
  function later() {
    setTimeout(run, 0);
    setTimeout(run, 500);
    setTimeout(run, 2000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', later);
  else later();
  window.addEventListener('load', later);
  document.addEventListener('click', function () { setTimeout(run, 50); }, true);
})();
</script>

<!-- 상품 상세(shop_view) — 구매평을 상세정보 아래에 항상 표시 + 탭 클릭 시 새로고침 없이 앵커 이동 -->
<!-- 아임웹 관리자 > 환경설정 > SEO의 '바디 코드'에 붙여넣기 (상세정보 칸은 스크립트 불가) -->
<!--
  동작
  1. 첫 진입 시 아임웹의 '구매평' 모드(상세정보 + 구매평이 함께 그려짐)를 조용히 불러온다. 스크롤 위치·URL은 유지.
  2. 구매평 탭 → 구매평 시작 위치로 스크롤 / 상세정보 탭 → 읽던 위치로 복귀 (읽던 곳이 없으면 상세정보 맨 위) — 둘 다 다시 그리지 않음
  3. 스크롤 위치에 따라 탭 활성 표시가 바뀜
  4. #prod_detail_review 로 들어오면 구매평 위치로 바로 이동
  Q&A 탭은 아임웹 기본 동작 그대로.
  디버그: 주소 뒤에 &bdreview=debug 를 붙이면 콘솔에 로그가 찍힘
-->
<script>
(function () {
  var PRODUCT_IDX = ['63']; // 적용할 상품 idx. 비우면([]) 모든 상품에 적용
  var EXTRA_OFFSET = 16;    // 고정 탭바 아래 여백(px). 사이트 헤더가 고정이라 가려지면 늘리기

  if (!/\/shop_view/.test(location.pathname)) return;
  var idx = new URLSearchParams(location.search).get('idx');
  if (PRODUCT_IDX.length && PRODUCT_IDX.indexOf(idx) < 0) return;

  var DEBUG = /bdreview=debug/.test(location.search);
  function log() { if (DEBUG) console.log.apply(console, ['[bd-review]'].concat([].slice.call(arguments))); }

  // 구매평 영역에만 있는 요소 (상세정보 안의 .nnd-review 같은 자체 요소와 겹치지 않게)
  var REVIEW_MARK = '#starPointer, .comment_list, [id^="comment_count_"], .review_summary_wrap, ._review_summary_wrap, .review-box';

  var loading = false, holdScroll = false, queue = [];
  var autoScrolling = false, autoTimer = null, lastDetailY = null; // lastDetailY: 상세정보에서 마지막으로 읽던 위치

  // 탭바가 position:fixed가 되면 offsetParent가 null이 되므로 getClientRects로 표시 여부 판단
  function shown(el) { return !!el && el.getClientRects().length > 0; }
  function isMobile() {
    return !shown(document.querySelector('._prod_detail_detail_lazy_load'));
  }
  function body() {
    return document.querySelector(isMobile() ? '._prod_detail_detail_lazy_load_mobile' : '._prod_detail_detail_lazy_load');
  }
  // 구매평 모드 클래스: PC 'product_review', 모바일 'product_review_mobile'
  function inReview(b) { return !!b && (b.classList.contains('product_review') || b.classList.contains('product_review_mobile')); }

  // 구매평 영역이 시작되는 요소
  function reviewAnchor(b) {
    if (!b) return null;
    var kids = b.children, start = -1, i;
    for (i = 0; i < kids.length; i++) {
      if (kids[i].matches(REVIEW_MARK) || kids[i].querySelector(REVIEW_MARK)) { start = i; break; }
    }
    if (start < 0) return null;
    if (start === 0) return kids[0].matches(REVIEW_MARK) ? kids[0] : kids[0].querySelector(REVIEW_MARK);
    // 바로 앞의 '구매평 59' 같은 제목·요약 블록도 포함
    while (start > 1) {
      var p = kids[start - 1];
      if (p.offsetHeight < 300 && !p.querySelector('img, iframe, video') && /구매평|리뷰|review|평점|별점/i.test(p.textContent)) start--;
      else break;
    }
    return kids[start];
  }

  function offset() {
    var nav = document.querySelector(isMobile() ? '#tab_offset .site_prod_nav' : '#pc_tab_offset .site_prod_nav');
    return (nav ? nav.offsetHeight : 0) + EXTRA_OFFSET;
  }
  function scrollToEl(el) {
    if (!el) return;
    scrollToY(el.getBoundingClientRect().top + window.pageYOffset - offset());
  }
  // 탭으로 이동하는 동안 지나가는 위치는 '읽던 위치'로 기록하지 않음
  function scrollToY(y) {
    autoScrolling = true;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(function () { autoScrolling = false; }, 1500);
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  }
  window.addEventListener('scrollend', function () {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(function () { autoScrolling = false; }, 100);
  });
  function setHash(hash) {
    history.replaceState(history.state, '', location.pathname + location.search + hash);
  }

  var current = null;
  function setActive(type) {
    if (current === type) return;
    current = type;
    document.querySelectorAll('.site_prod_nav').forEach(function (nav) {
      if (nav.querySelector('li.activeborder')) nav.setAttribute('data-bd-border', '1');
      var border = nav.hasAttribute('data-bd-border');
      nav.querySelectorAll('a._detail, a._review, a._qna').forEach(function (a) {
        var on = a.classList.contains('_' + type);
        a.classList.toggle('active', on);
        if (border && a.parentElement) a.parentElement.classList.toggle('activeborder', on);
      });
    });
  }

  function waitFor(cond, done, fail, ms) {
    var t0 = Date.now();
    (function tick() {
      if (cond()) return done();
      if (Date.now() - t0 > (ms || 10000)) return fail && fail();
      setTimeout(tick, 100);
    })();
  }

  // 구매평 모드가 아니면 아임웹 함수로 불러온 뒤 cb 실행
  function ensureReview(cb, keepScroll, onFail) {
    var b = body();
    if (inReview(b) && reviewAnchor(b)) return cb && cb();
    if (cb) queue.push(cb);
    if (loading) return;

    var S = window.SITE_SHOP_DETAIL;
    if (!S) { queue = []; log('SITE_SHOP_DETAIL 없음'); return onFail && onFail(); }
    loading = true;
    var url = location.href, y = window.pageYOffset, t0 = Date.now();
    holdScroll = !!keepScroll;
    log('구매평 모드 불러오는 중', isMobile() ? 'mobile' : 'pc');

    if (isMobile()) S.changeContentTab('review', 0, 0);
    else S.changeContentPCTab('review', 0, 0, true);

    // 아임웹이 탭 위치로 끌어올리는 스크롤을 되돌림 (사용자가 직접 움직이면 중단)
    (function hold() {
      if (!holdScroll) return;
      if (window.jQuery) window.jQuery('html, body').stop(true);
      if (window.pageYOffset !== y) window.scrollTo(0, y);
      if (Date.now() - t0 < 2000) requestAnimationFrame(hold);
    })();

    waitFor(function () { return inReview(body()) && reviewAnchor(body()); }, function () {
      loading = false;
      if (keepScroll && location.href !== url) history.replaceState(history.state, '', url);
      log('구매평 영역', reviewAnchor(body()));
      var q = queue; queue = [];
      q.forEach(function (f) { f(); });
    }, function () {
      loading = false; queue = [];
      log('구매평 영역을 찾지 못함');
      if (onFail) onFail();
    });
  }

  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (ev) {
    window.addEventListener(ev, function () { holdScroll = false; autoScrolling = false; }, { passive: true });
  });

  // 상세정보·구매평 탭: 아임웹 onclick(다시 그리기 + 맨 위 이동) 대신 스크롤만
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('.site_prod_nav a._review, .site_prod_nav a._detail, .site_prod_nav a._qna');
    if (!a) return;
    if (a.classList.contains('_qna')) { current = null; return; } // Q&A는 아임웹 기본 동작
    e.preventDefault();
    e.stopPropagation();
    var type = a.classList.contains('_review') ? 'review' : 'detail';
    ensureReview(function () {
      if (type === 'review') {
        var w = where();
        if (w !== 'review') lastDetailY = w === 'detail' ? window.pageYOffset : null;
        scrollToEl(reviewAnchor(body()));
        setHash('#prod_detail_review');
      } else {
        // 구매평을 보다가 누르면 읽던 곳으로, 이미 상세정보 안이거나 읽던 곳이 없으면 맨 위로
        if (where() === 'review' && lastDetailY !== null) scrollToY(lastDetailY);
        else scrollToEl(body());
        setHash('#prod_detail_detail');
      }
      setActive(type);
    }, false, function () {
      // 구매평 영역을 못 찾으면 아임웹 기본 동작으로 (탭이 먹통이 되지 않도록)
      var S = window.SITE_SHOP_DETAIL;
      if (!S) return;
      if (isMobile()) S.changeContentTab(type, 0, 0);
      else if (type === 'review') S.changeContentPCTab('review', 0, 0, true);
      else S.changeContentPCTab('detail', 0, 0, true, false, 0, 100);
    });
  }, true);

  // 현재 스크롤 위치: 'above'(상세정보 위) / 'detail' / 'review'
  function where() {
    var b = body(), anchor = reviewAnchor(b);
    if (!inReview(b) || !anchor) return null;
    if (anchor.getBoundingClientRect().top - offset() <= 1) return 'review';
    return b.getBoundingClientRect().top - offset() <= 1 ? 'detail' : 'above';
  }

  // 스크롤 위치에 따라 탭 활성 표시 + 읽던 위치 기록
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      if (loading) return;
      var w = where();
      if (!w) return;
      setActive(w === 'review' ? 'review' : 'detail');
      if (w === 'detail' && !autoScrolling) lastDetailY = window.pageYOffset;
    });
  }, { passive: true });

  function init() {
    waitFor(function () { return window.SITE_SHOP_DETAIL && body(); }, function () {
      if (location.hash === '#prod_detail_review') {
        ensureReview(function () {
          setTimeout(function () { scrollToEl(reviewAnchor(body())); setActive('review'); }, 300);
        });
      } else {
        ensureReview(function () { setActive('detail'); }, true);
      }
    });
  }

  if (document.readyState === 'complete') setTimeout(init, 0);
  else window.addEventListener('load', function () { setTimeout(init, 0); });
})();
</script>

<!-- 상품 상세 상단 공통 프로모션 배너(#bd-promo) — 세일이 끝나면 자동으로 숨김 -->
<script>
(function () {
  var PROMO_END = '2026-11-01T00:00:00+09:00'; // 이 시각부터 숨김. 세일 연장 시 바꾸기
  if (Date.now() < new Date(PROMO_END).getTime()) return;
  var s = document.createElement('style');
  s.textContent = '#bd-promo, .bd-promo { display: none !important; }';
  document.head.appendChild(s);
})();
</script>
